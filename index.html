<body>
<div id="loginOverlay" class="login-overlay"><div class="login-box">
<h1>CASINO MASTER</h1><p>Secure staff login — choose your assigned account.</p>
<div class="field"><label>Username</label><input id="loginUsername" autocomplete="username"></div>
<div class="field"><label>Password</label><input id="loginPassword" type="password" autocomplete="current-password"></div>
<button class="btn primary" type="button" onclick="loginUser()">LOGIN</button>
<div id="loginError" class="login-error"></div>
</div></div>
<div class="app">
<aside class="side"><div class="brand"><img class="casino-real-logo" src="logo.png" alt="86 CASINO">
<div class="app-version-label">V1.139</div><small>MANAGEMENT SYSTEM</small></div><div class="nav" id="nav"></div></aside>
<main class="main"><div class="top"><div><h1 id="title" style="margin:0;font-size:26px">Dashboard</h1><div id="subtitle" class="user">Central casino control</div></div><div class="user">Logged in: <b id="role">General Manager</b></div></div><div id="content"></div></main>
</div>
<script>
/* V1.52 CLEAN DATA: this release starts with a genuinely empty demo database.
   It clears test customers, transactions, rewards/loans (stored in tx), and rate history
   once on first launch. User accounts are preserved so staff can log in normally. */
(function(){
  // V1.68 REPORT UPDATE: preserve the existing V1.67 test database exactly as-is.
  // No data reset or migration is performed in this release.
})();

const roles={
  "Reception":["dashboard","customers"],
  "Pit Manager":["dashboard","customers","loans","rewards","cashback","reports","balance","tableopening","totaltable"],
  "Cashier":["dashboard","customers","cashier","reports","balance","tableopening","totaltable","tablefillcredit"],
  "Manager":["dashboard","customers","cashier","loans","rewards","cashback","reports","customerwise","balance","settings","tableopening","totaltable"]
};
const labels={dashboard:"Dashboard",customers:"Customers",cashier:"Cashier",loans:"Loans",rewards:"Rewards",reports:"Reports",customerwise:"Customer Wise Report",cashback:"Cash Back",balance:"Daily Balance",settings:"Settings",tableopening:"Table Opening / Closing",totaltable:"Total Table Summary",tablefillcredit:"Table Fill / Credit Record"};
const defaultUsers=[
  {username:"manager",password:"Manager@123",name:"General Manager",role:"Manager",active:true},
  {username:"reception",password:"Reception@123",name:"Reception",role:"Reception",active:true},
  {username:"cashier",password:"Cashier@123",name:"Cashier",role:"Cashier",active:true},
  {username:"pitmanager",password:"PitManager@123",name:"Pit Manager",role:"Pit Manager",active:true}
];
let authUsers=JSON.parse(localStorage.getItem("casinoUsers")||"null");
if(!Array.isArray(authUsers)||!authUsers.length){
  authUsers=defaultUsers.map(u=>({...u}));
}else{
  // V1.87: repair legacy/corrupt local account data while preserving other staff accounts.
  authUsers=authUsers.filter(u=>u && typeof u==="object");
  authUsers=authUsers.map(u=>({...u,username:String(u.username||"").trim().toLowerCase(),password:String(u.password||""),active:u.active!==false}));
  const mi=authUsers.findIndex(u=>u.username==="manager");
  if(mi<0) authUsers.unshift({...defaultUsers[0]});
  else authUsers[mi]={...authUsers[mi],...defaultUsers[0],active:true};
}
localStorage.setItem("casinoUsers",JSON.stringify(authUsers));
let currentUser=JSON.parse(sessionStorage.getItem("casinoCurrentUser")||"null");
// V1.87: robust role detection for legacy/session records.
function userRole(){
  if(!currentUser) return "";
  if(String(currentUser.username||"").toLowerCase()==="manager") return "Manager";
  return String(currentUser.role||"");
}
function canManageTableSummary(){
  if(!currentUser) return false;
  const username=String(currentUser.username||"").trim().toLowerCase();
  const sessionRole=String(currentUser.role||"").trim().toLowerCase().replace(/\s+/g," ");
  const account=authUsers.find(u=>String(u?.username||"").trim().toLowerCase()===username);
  const accountRole=String(account?.role||"").trim().toLowerCase().replace(/\s+/g," ");
  return username==="manager" || sessionRole==="manager" || sessionRole==="pit manager" || sessionRole==="pitmanager" || accountRole==="manager" || accountRole==="pit manager" || accountRole==="pitmanager";
}
function hasPermission(page){const r=userRole();return !!currentUser && (roles[r]||[]).includes(page);}
function requirePermission(page){if(!hasPermission(page)){alert("You do not have permission to access this section.");return false;}return true;}
function loginUser(){
  const u=(document.getElementById("loginUsername")?.value||"").trim().toLowerCase();
  const p=document.getElementById("loginPassword")?.value||"";
  const found=authUsers.find(x=>x && x.active!==false&&String(x.username||"").toLowerCase()===u&&String(x.password||"")===p);
  const err=document.getElementById("loginError");
  if(!found){if(err)err.textContent="Invalid username or password.";return;}
  currentUser={username:found.username,name:found.name,role:(String(found.username||"").toLowerCase()==="manager"?"Manager":found.role)};
  sessionStorage.setItem("casinoCurrentUser",JSON.stringify(currentUser));
  document.getElementById("loginOverlay").style.display="none";
  updateLoggedIn(); nav(); show("dashboard");
}
function logoutUser(){sessionStorage.removeItem("casinoCurrentUser");currentUser=null;document.getElementById("loginOverlay").style.display="flex";document.getElementById("loginUsername").value="";document.getElementById("loginPassword").value="";document.getElementById("loginError").textContent="";nav();}
function updateLoggedIn(){const e=document.getElementById("role");if(e)e.innerHTML=`${currentUser?.name||""} <span class="pill">${currentUser?.role||""}</span> <button class="btn logout" style="margin-left:8px;padding:6px 10px" onclick="logoutUser()">Logout</button>`;}
function manageUsers(){
 if(!requirePermission("settings"))return;
 const c=document.getElementById("content");
 c.innerHTML=`<div class="panel"><h2>User Accounts & Permissions</h2><div class="permission-note">Manager only. Passwords in this prototype are stored locally. In the production cloud version, authentication will be server-side with securely hashed passwords.</div>
 <div class="formgrid"><div class="field"><label>Username *</label><input id="newUsername"></div><div class="field"><label>Display Name *</label><input id="newName"></div><div class="field"><label>Role *</label><select id="newRole"><option>Manager</option><option>Reception</option><option>Cashier</option><option>Pit Manager</option></select></div><div class="field"><label>Password *</label><input id="newPassword" type="password"></div></div><div class="actions"><button class="btn primary" onclick="addUserAccount()">Create User</button></div></div>
 <div class="panel"><h2>Existing User Accounts</h2>${authUsers.map((u,i)=>`<div style="padding:12px 0;border-bottom:1px solid #edf0f2"><b>${u.name}</b> — ${u.username} — <span class="pill">${u.role}</span> — ${u.active===false?"Disabled":"Active"}<div class="actions"><button class="btn muted" onclick="toggleUser(${i})">${u.active===false?"Enable":"Disable"}</button>${u.username!==currentUser.username?`<button class="btn danger" onclick="deleteUser(${i})">Delete</button>`:""}</div></div>`).join("")}</div>`;
}
function addUserAccount(){const username=(document.getElementById("newUsername")?.value||"").trim().toLowerCase(),name=(document.getElementById("newName")?.value||"").trim(),role=document.getElementById("newRole")?.value,password=document.getElementById("newPassword")?.value||"";if(!username||!name||!password)return alert("Complete username, display name and password.");if(!/^[a-z0-9._-]{3,30}$/.test(username))return alert("Username must be 3-30 characters using letters, numbers, dot, underscore or hyphen.");if(authUsers.some(u=>u.username.toLowerCase()===username))return alert("Username already exists.");authUsers.push({username,name,role,password,active:true});localStorage.setItem("casinoUsers",JSON.stringify(authUsers));alert("User account created.");manageUsers();}
function toggleUser(i){if(authUsers[i].username===currentUser.username)return alert("You cannot disable your own account.");authUsers[i].active=authUsers[i].active===false;localStorage.setItem("casinoUsers",JSON.stringify(authUsers));manageUsers();}
function deleteUser(i){if(authUsers[i].username===currentUser.username)return alert("You cannot delete your own account.");if(!confirm("Delete this user account?"))return;authUsers.splice(i,1);localStorage.setItem("casinoUsers",JSON.stringify(authUsers));manageUsers();}

let customers=JSON.parse(localStorage.getItem("customers")||"[]");
let tx=JSON.parse(localStorage.getItem("tx")||"[]");

// Repair duplicate/invalid customer IDs from earlier prototype builds.
// This runs once on page load so old test data cannot cause the next customer to reuse CUS-000001.
// The first customer keeps an existing ID; later duplicates receive the next unique ID.
function repairCustomerIds(){
  const used=new Set(), oldToNew=[];
  let max=customers.reduce((m,x)=>Math.max(m,Number(String(x.id||"").replace(/\D/g,""))||0),0);
  customers.forEach((c,i)=>{
    let id=String(c.id||"").trim();
    if(!/^CUS-\d{6}$/.test(id) || used.has(id)){
      const old=id;
      do { max++; id="CUS-"+String(max).padStart(6,"0"); } while(used.has(id));
      c.id=id;
      oldToNew.push({customer:c,old,newId:id});
    }
    used.add(id);
  });
  // Relink historical transactions when the transaction also stored the customer's name.
  // Rewards and new Cashier transactions store customerName, so duplicate legacy IDs can be repaired safely.
  oldToNew.forEach(m=>{
    if(!m.old)return;
    tx.forEach(x=>{
      if(x.customerId!==m.old)return;
      const sameName=String(x.customerName||"").trim().toLowerCase()===String(m.customer.name||"").trim().toLowerCase();
      if(sameName) x.customerId=m.newId;
    });
  });
  if(oldToNew.length){
    localStorage.setItem("customers",JSON.stringify(customers));
    localStorage.setItem("tx",JSON.stringify(tx));
  }
}
repairCustomerIds();
function repairLegacyBuyIns(){
let changed=false, rates=getCurrencyRates();
tx=tx.map(x=>{
if(x.type==="BUY_IN"&&x.currency==="GHS"&&Number(x.amount)>0&&(!x.rate||Number(x.rate)<=1)&&Number(x.usd)===Number(x.amount)){
let rate=Number(rates.USD);
if(rate>0){x.rate=rate;x.usdRate=rate;x.usd=Number(x.amount)/rate;changed=true;}
}
return x;
});
if(changed)save();
}
function save(){localStorage.setItem("customers",JSON.stringify(customers));localStorage.setItem("tx",JSON.stringify(tx))}
function businessDateForNow(){const d=new Date(); if(d.getHours()<18)d.setDate(d.getDate()-1); return d.toISOString().slice(0,10);}
function closedBusinessDates(){try{return JSON.parse(localStorage.getItem('casinoClosedBusinessDates')||'{}')||{};}catch(e){return {};}}
function isBusinessDateClosed(date){return !!closedBusinessDates()[String(date||'').slice(0,10)];}
function markBusinessDateClosed(date,by){const s=closedBusinessDates();s[String(date||'').slice(0,10)]={closedAt:new Date().toISOString(),closedBy:by||currentUser?.name||currentUser?.username||''};localStorage.setItem('casinoClosedBusinessDates',JSON.stringify(s));}
function dayEndPending(date){const d=String(date||'').slice(0,10), out=[];
 const loans=tx.filter(x=>x.type==='LOAN'&&x.action==='LOAN_APPROVED'&&x.status==='PENDING_CASHIER'&&txBusinessDate(x)===d); if(loans.length)out.push(`${loans.length} CREDIT approval${loans.length===1?'':'s'} awaiting Cashier`);
 const reps=tx.filter(x=>x.type==='LOAN'&&x.action==='LOAN_REPAYMENT_PENDING'&&x.status==='PENDING_CASHIER'&&txBusinessDate(x)===d); if(reps.length)out.push(`${reps.length} DEPOSIT receipt${reps.length===1?'':'s'} awaiting Cashier`);
 const rew=tx.filter(x=>x.type==='REWARD'&&x.status==='PENDING_CASHIER'&&txBusinessDate(x)===d); if(rew.length)out.push(`${rew.length} reward payment${rew.length===1?'':'s'} awaiting Cashier`);
 const ops=tableOps().filter(x=>x.businessDate===d&&tableOpStatus(x)==='PENDING'); if(ops.length)out.push(`${ops.length} Table Fill/Credit confirmation${ops.length===1?'':'s'} awaiting Cashier`);
 const tables=tableRecords(), openTables=TABLE_ORDER.filter(code=>{const rec=tables.find(x=>x.businessDate===d&&x.tableCode===code);return !!rec?.openedAt && rec.status!=='CLOSED' && !rec?.closedAt;});
 if(openTables.length)out.push(`Table closing not completed: ${openTables.map(code=>`${code} — ${TABLE_CONFIG[code]?.name||code}`).join(', ')}`);
 return out;

function customerWiseDateDefaults(){
  const end=reportLatestDate();
  const d=new Date(end+'T12:00:00');
  d.setDate(d.getDate()-29);
  return {start:d.toISOString().slice(0,10),end};
}
function customerWiseRows(cid,start,end){
  return tx.filter(x=>x.customerId===cid).filter(x=>{const d=reportBusinessDate(x);return d>=start&&d<=end;});
}
function customerWiseData(cid,start,end){
  const rs=customerWiseRows(cid,start,end);
  const buy=rs.filter(x=>x.type==='BUY_IN').reduce((s,x)=>s+Number(x.usd||0),0);
  const loanGiven=rs.filter(x=>x.type==='LOAN'&&(x.action==='LOAN_PAID'||x.action==='LOAN_GIVEN'||x.status==='PAID_GIVEN')).reduce((s,x)=>s+Number((x.usd!=null?x.usd:x.amount)||0),0);
  const cashOut=rs.filter(x=>x.type==='CASH_OUT').reduce((s,x)=>s+Number(x.usd||0),0);
  const loanRepaid=rs.filter(x=>x.type==='LOAN'&&(x.action==='LOAN_REPAID'||x.status==='RECEIVED')).reduce((s,x)=>s+Number((x.usd!=null?x.usd:x.amount)||0),0);
  return {buy,loanGiven,totalIn:buy+loanGiven,cashOut,loanRepaid,totalOut:cashOut+loanRepaid,result:(cashOut+loanRepaid)-(buy+loanGiven),rows:rs};
}
function customerWiseDailyRows(cid,start,end){
  const map={};
  for(let d=new Date(start+'T12:00:00');d<=new Date(end+'T12:00:00');d.setDate(d.getDate()+1)){
    const key=d.toISOString().slice(0,10); map[key]={date:key,buy:0,loanGiven:0,cashOut:0,loanRepaid:0};
  }
  customerWiseRows(cid,start,end).forEach(x=>{
    const d=reportBusinessDate(x); if(!map[d])return;
    if(x.type==='BUY_IN')map[d].buy+=Number(x.usd||0);
    else if(x.type==='CASH_OUT')map[d].cashOut+=Number(x.usd||0);
    else if(x.type==='LOAN'&&(x.action==='LOAN_PAID'||x.action==='LOAN_GIVEN'||x.status==='PAID_GIVEN'))map[d].loanGiven+=Number((x.usd!=null?x.usd:x.amount)||0);
    else if(x.type==='LOAN'&&(x.action==='LOAN_REPAID'||x.status==='RECEIVED'))map[d].loanRepaid+=Number((x.usd!=null?x.usd:x.amount)||0);
  });
  return Object.values(map).map(x=>({...x,totalIn:x.buy+x.loanGiven,totalOut:x.cashOut+x.loanRepaid,result:(x.cashOut+x.loanRepaid)-(x.buy+x.loanGiven)}));
}

function balanceCurrencyRate(currency,r){
 if(currency==='USD')return 1;
 if(currency==='GHS')return Number(r?.usdRate)||balanceRate();
 if(currency==='EUR'){
   if(Number(r?.eurRate)>0) return Number(r.eurRate);
   if(Number(r?.eur)>0) return Number(r.eur);
   return Number(getCurrencyRate('EUR'))||1;
 }
 if(currency==='GBP'){
   if(Number(r?.gbpRate)>0) return Number(r.gbpRate);
   if(Number(r?.gbp)>0) return Number(r.gbp);
   return Number(getCurrencyRate('GBP'))||1;
 }
 return 1;
}

function getCurrencyRate(currency){
 let rates=getCurrencyRates(), foreign=getForeignUsdRates();
 if(currency==="GHS") return Number(rates.USD);
 if(currency==="USD") return 1;
 if(currency==="EUR") return Number(foreign.EUR)||0;
 if(currency==="GBP") return Number(foreign.GBP)||0;
 return 0;
}
function getManagerUsdRate(){ return Number(getCurrencyRates().USD)||0; }
function getUsdValue(currency,amount){
 let rates=getCurrencyRates(), foreign=getForeignUsdRates(), a=Number(amount)||0;
 if(currency==="USD") return a;
 if(currency==="GHS") return Number(rates.USD)>0 ? a/Number(rates.USD) : 0;
 if(currency==="EUR") return a*(Number(foreign.EUR)||0);
 if(currency==="GBP") return a*(Number(foreign.GBP)||0);
 return 0;
}

function txBusinessDate(x){
 const bd=String(x?.businessDate||'').trim().slice(0,10);
 if(bd)return bd;
 const raw=x?.date||x?.createdAt||x?.timestamp;
 if(!raw)return '';
 const d=new Date(raw);
 if(Number.isNaN(d.getTime()))return '';
 if(d.getHours()<18)d.setDate(d.getDate()-1);
 return d.toISOString().slice(0,10);
}

function getCustomerLoanBalance(cid){
let issued=0,repaid=0;
tx.filter(x=>x.customerId===cid).forEach(x=>{
  if(x.type==="LOAN"&&x.action==="LOAN_PAID") issued+=Number(x.amount||0);
  if(x.type==="LOAN"&&x.action==="LOAN_REPAID") repaid+=Number(x.amount||0);
  // Keep compatibility with the old prototype's loan records.
  if(x.type==="LOAN"&&x.action==="Loan Approved") issued+=Number(x.amount||0);
  if(x.type==="LOAN"&&x.action==="Loan Return Accepted") repaid+=Number(x.amount||0);
});
return {issued,repaid,balance:Math.max(0,issued-repaid)};
}

function cashbackDailyResult(customerId,businessDate){
 const rs=reportRowsFor(businessDate).filter(x=>x.customerId===customerId);
 const totalIn=rs.filter(x=>x.type==='BUY_IN').reduce((s,x)=>s+Number(x.usd||0),0)+rs.filter(x=>x.type==='LOAN'&&(x.action==='LOAN_PAID'||x.action==='LOAN_GIVEN'||x.status==='PAID_GIVEN')).reduce((s,x)=>s+Number((x.usd!=null?x.usd:x.amount)||0),0);
 const totalOut=rs.filter(x=>x.type==='CASH_OUT').reduce((s,x)=>s+Number(x.usd||0),0)+rs.filter(x=>x.type==='LOAN'&&(x.action==='LOAN_REPAID'||x.status==='RECEIVED')).reduce((s,x)=>s+Number((x.usd!=null?x.usd:x.amount)||0),0);
 return {totalIn,totalOut,result:totalOut-totalIn,count:rs.length};
}

function renderCashbackHistory(){

function downloadRewardHistory(type){
 const rows=rewardRows().filter(x=>x.rewardType===type), label=rewardLabel(type), unit=type==="LUCKY_CHIPS"?"GHS":"USD";
 let lines=[[label+' History','Customer','Amount','Status','Approved By','Paid / Given By','Paid / Given Time','Reference']]; rows.forEach(x=>{const c=customers.find(q=>q.id===x.customerId)||{};lines.push([new Date(x.date).toLocaleString(),c.name||x.customerId,unit+' '+Number(x.amount||0).toFixed(2),x.status||'',x.approvedBy||'',x.paidBy||'',x.paidAt?new Date(x.paidAt).toLocaleString():'',x.reference||'']);});
 const csv='\ufeff'+lines.map(r=>r.map(v=>'"'+String(v??'').replace(/"/g,'""')+'"').join(',')).join('\r\n'); const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([csv],{type:'text/csv;charset=utf-8;'}));a.download=label.replace(/[^A-Za-z0-9]+/g,'_')+'_History.csv';document.body.appendChild(a);a.click();a.remove();
}
